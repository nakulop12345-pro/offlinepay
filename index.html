<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OfflinePay</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">

    <header class="topbar">
      <div>
        <p class="eyebrow">OFFLINEPAY</p>
        <h1>Good evening</h1>
      </div>

      <button class="icon-button" aria-label="Profile">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3"></circle>
          <path d="M5 20c.8-3.5 3.1-5 7-5s6.2 1.5 7 5"></path>
        </svg>
      </button>
    </header>

    <section class="balance-card">
      <p>Available balance</p>
      <h2>₹ <span id="balance">1,000.00</span></h2>
      <span class="demo-badge">DEMO BALANCE</span>
    </section>

    <section class="actions">

      <button class="action-button" id="sendButton">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h13"></path>
          <path d="m13 6 6 6-6 6"></path>
        </svg>
        <span>Send</span>
      </button>

      <button class="action-button" id="receiveButton">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H6"></path>
          <path d="m11 18-6-6 6-6"></path>
        </svg>
        <span>Receive</span>
      </button>

    </section>

    <section class="activity">

      <div class="section-header">
        <h3>Recent activity</h3>
        <button>View all</button>
      </div>

      <div id="transactions" class="transactions">

        <div class="transaction">

          <div class="transaction-icon received">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14"></path>
              <path d="m6 13 6 6 6-6"></path>
            </svg>
          </div>

          <div class="transaction-info">
            <strong>Payment received</strong>
            <span>Demo transaction</span>
          </div>

          <strong class="amount positive">+₹250</strong>

        </div>

        <div class="transaction">

          <div class="transaction-icon sent">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19V5"></path>
              <path d="m18 11-6-6-6 6"></path>
            </svg>
          </div>

          <div class="transaction-info">
            <strong>Payment sent</strong>
            <span>Demo transaction</span>
          </div>

          <strong class="amount negative">−₹100</strong>

        </div>

      </div>

    </section>

    <nav class="bottom-nav">

      <button class="nav-item active">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 10.5 12 4l8 6.5V20H4z"></path>
        </svg>
        <span>Home</span>
      </button>

      <button class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="2"></rect>
          <path d="M8 8h8M8 12h8M8 16h4"></path>
        </svg>
        <span>Activity</span>
      </button>

      <button class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3"></circle>
          <path d="M5 20c.8-3.5 3.1-5 7-5s6.2 1.5 7 5"></path>
        </svg>
        <span>Profile</span>
      </button>

    </nav>

  </main>
 <div id="qrModalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
